[tools]
node = "24"

[tasks.setup]
description = "Install locked dependencies"
run = "npm ci"

[tasks.lint]
description = "Lint TypeScript with Oxlint"
run = "npm run lint"

[tasks.format]
description = "Format the repository with Oxfmt"
run = "npm run format"

[tasks."format:check"]
description = "Check formatting with Oxfmt"
run = "npm run format:check"

[tasks.typecheck]
description = "Type-check without emitting files"
run = "npm run typecheck"

[tasks.test]
description = "Run the test suite"
run = "npm test"

[tasks.check]
description = "Run all required checks"
run = "npm run check"
